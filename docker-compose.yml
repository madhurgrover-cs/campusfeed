services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: campusfeed
      POSTGRES_USER: ${POSTGRES_USER:-campusfeed_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusfeed_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
